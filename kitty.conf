confirm_os_window_close 0
remember_window_size  no

font_family iMWritingMono Nerd Font Mono
font_size 10
disable_ligatures yes

background #000000
background_opacity 0.85
background_blur 2

foreground #f4f1f8
window_padding_width 3

shell zsh
shell_integration disabled

cursor_shape underline
cursor_shape_unfocused underline
cursor_trail 1

enable_audio_bell no

scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
































































# BEGIN_KITTY_FONTS
font_family      family='iMWritingMono Nerd Font Mono' postscript_name=IMWritingMonoNFM
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
